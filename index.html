<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NineCSpensaku</title>

    <meta name="description" content="Official Website of Class 9C SMP Negeri 1 Pangkalan Kuras">

    <link rel="icon" href="assets/images/logo.png">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Loading -->

    <div id="loading">

        <img src="assets/images/logo.png" class="loading-logo">

        <h2>Loading...</h2>

    </div>



    <!-- Background -->

    <div class="background">

        <div class="stars"></div>

    </div>



    <!-- Main -->

    <main id="app">

        <!-- Hero -->

        <section class="hero">

            <img src="assets/images/logo.png" class="logo">

            <h1 id="class-name"></h1>

            <p id="school-name"></p>

            <p id="academic-year"></p>

        </section>



        <!-- About -->

        <section class="card">

            <h2>About Class</h2>

            <p id="about">

                Welcome to the official website of Class 9C SMP Negeri 1 Pangkalan Kuras.

            </p>

        </section>



        <!-- Motto -->

        <section class="card">

            <h2>Class Motto</h2>

            <p id="motto"></p>

        </section>



        <!-- Buttons -->

        <section class="buttons">

            <button id="social-button">

                🌐 Media Sosial

            </button>

            <button id="invite-button">

                📨 Invitation

            </button>

        </section>

    </main>



    <!-- Footer -->

    <footer>

        <p id="footer-text"></p>

    </footer>



    <script src="js/main.js"></script>

</body>

</html>
