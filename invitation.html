<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Invitation</title>

    <link rel="icon"
        href="assets/images/logo.png">

    <link rel="stylesheet"
        href="css/invitation.css">

</head>

<body>

    <!-- Background -->

    <div class="background">

        <div class="stars"></div>

    </div>

    <main class="container">

        <!-- Header -->

        <section class="hero">

            <img
                src="assets/images/logo.png"
                class="logo">

            <h1>

                Collaboration Invitation

            </h1>

            <p id="class-info"></p>

        </section>

        <!-- Greeting -->

        <section class="card">

            <h2>

                👋 Welcome

            </h2>

            <p id="description">

            </p>

        </section>

        <!-- Requirements -->

        <section class="card">

            <h2>

                📋 Requirements

            </h2>

            <ul id="requirements">

            </ul>

        </section>

        <!-- Status -->

        <section class="card">

            <h2>

                📊 Submission Status

            </h2>

            <div
                id="status-card">

            </div>

        </section>

        <!-- Information -->

        <section class="card">

            <h2>

                📌 Information

            </h2>

            <div class="info-list">

                <div class="info-item">

                    <span>📅 Deadline</span>

                    <span id="deadline"></span>

                </div>

                <div class="info-item">

                    <span>🏫 School</span>

                    <span id="school"></span>

                </div>

            </div>

        </section>

        <!-- Action -->

        <section class="buttons">

            <button
                id="concept-button">

                🎬 View Concept

            </button>

            <button
                id="upload-button">

                📤 Upload File

            </button>

            <button
                id="whatsapp-button">

                💬 WhatsApp Admin

            </button>

        </section>

    </main>

    <script
        src="js/invitation.js">

    </script>

</body>

</html>
